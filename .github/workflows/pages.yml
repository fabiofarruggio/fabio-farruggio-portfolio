name: Publish approved static portfolio
on:
  workflow_dispatch:
    inputs:
      approval_reference:
        description: Scoped owner approval reference (required; do not include secrets)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: approved-portfolio-pages
  cancel-in-progress: false
jobs:
  build:
    if: vars.PORTFOLIO_PUBLICATION_APPROVED == 'true'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PORTFOLIO_SITE: ${{ vars.PORTFOLIO_SITE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Require approved public origin
        shell: bash
        run: test -n "$PORTFOLIO_SITE"
      - run: npm ci --ignore-scripts --no-fund
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy approved artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
